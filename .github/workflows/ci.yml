name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Every platform the app builds on: a change that only breaks the Linux build (the tray, the
    # GNOME and KDE system proxy), the Windows one (the core pipe, the registry proxy) or only the
    # macOS one would otherwise reach a release first.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # Git Bash on Windows, so the scripts run the same everywhere.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev protobuf-compiler

      - uses: arduino/setup-protoc@v3
        if: runner.os != 'Linux'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # 24, not 20: `npm test` runs the TypeScript tests directly, which needs Node's type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # build.rs generates the RPC bindings from the pinned core's proto, so nothing compiles until
      # the core is on disk. Checksums are verified against core.lock inside the script.
      - name: Fetch the pinned core
        run: ./scripts/fetch-core.sh

      - name: Typecheck and build the frontend
        run: npm run build
      - name: Frontend tests
        run: npm test

      # No `cargo fmt --check` gate: the tree is not rustfmt-clean today, and formatting it is a
      # separate decision from splitting the repositories.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # The integration tests that need a live core or a real TUN are #[ignore]d; this runs the rest.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # TEMPORARY, for the Windows PR only: prove the installer builds and carries the core.
      - name: Bundle the installer (temporary)
        if: runner.os == 'Windows'
        run: |
          npm run tauri build -- --bundles nsis --debug
          ls -la src-tauri/target/debug/bundle/nsis/
          7z l src-tauri/target/debug/bundle/nsis/*-setup.exe | grep -iE "nunya|\.exe"

