name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Every platform the app builds on: a change that only breaks the Linux build (the tray, the
    # GNOME and KDE system proxy), the Windows one (the core pipe, the registry proxy) or only the
    # macOS one would otherwise reach a release first.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # Git Bash on Windows, so the scripts run the same everywhere.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev protobuf-compiler

      - uses: arduino/setup-protoc@v3
        if: runner.os != 'Linux'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # 24, not 20: `npm test` runs the TypeScript tests directly, which needs Node's type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # build.rs generates the RPC bindings from the pinned core's proto, so nothing compiles until
      # the core is on disk. Checksums are verified against core.lock inside the script.
      - name: Fetch the pinned core
        run: ./scripts/fetch-core.sh

      - name: Typecheck and build the frontend
        run: npm run build
      - name: Frontend tests
        run: npm test

      # No `cargo fmt --check` gate: the tree is not rustfmt-clean today, and formatting it is a
      # separate decision from splitting the repositories.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # The integration tests that need a live core or a real TUN are #[ignore]d; this runs the rest.
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  phones:
    # Android and iOS compile from the same tree (issue #129), so code left behind on a phone fails
    # here rather than when someone next builds for one. Clippy on the library only: nothing runs
    # on a phone in CI, and the tests are the desktop's. iOS is the simulator target because it
    # needs no signing; it is built but not released (see CLAUDE.md, *Releasing*).
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, aarch64-apple-ios-sim]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # `generate_context!` embeds the built frontend, so it has to exist before the Rust does.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # The proto the RPC bindings are generated from; the desktop sidecar it also installs is
      # left out of a phone build by `tauri.<platform>.conf.json`.
      - name: Fetch the pinned core
        run: ./scripts/fetch-core.sh

      # The runner image carries an NDK; `ring` and the other C parts are compiled with its clang.
      - name: Point C builds at the NDK
        if: startsWith(matrix.target, 'aarch64-linux-android')
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/darwin-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --target ${{ matrix.target }} -- -D warnings
