name: release

# Every merge to main is a release, and a tag a person pushes is a stable one.
#
# - **A merge to main** publishes a beta (a GitHub pre-release). The version is worked out, not
#   typed: from the newest `vX.Y.Z` tag, a `feat:` merge bumps the middle number and anything else
#   the last (`scripts/version.mjs`). The first number never moves on its own.
# - **A tag you push** (`git tag v1.0.0 && git push origin v1.0.0`) publishes that version as a
#   stable release, marked Latest. "This is stable" is a decision, so it is the one number a person
#   picks; merges after it keep counting from it.
#
# Either way the version is stamped into the build, so the installers say it, and then committed
# back to main so the files do too. That commit is pushed with the workflow's own token, which by
# GitHub's rule starts no workflow run: no loop, and no second release for it.
#
# The macOS build is ad-hoc signed and carries no NetworkExtension entitlements: those need an Apple
# Developer team, and macOS kills an app that claims them without one. VPN mode on macOS runs its
# core as root instead, after the administrator prompt (`core_proc::grant_root`).
# scripts/build-app.sh is the signed build, with the packet tunnel extension, for when there is one.
#
# Releases are macOS only for now. Linux comes back next (the arm64 AppImage fails in linuxdeploy),
# then Windows. The Linux dependency step and bundle collection are kept, so a Linux row in the matrix is
# all it takes to bring it back once its build passes.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# One release at a time, and never cancelled: two merges close together are two releases, the
# second computed from the first's tag, not one release that silently swallows the other.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Which version this is
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            # A tag on a branch nobody merged is not a release.
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
              exit 1
            fi
            # Stable, unless the tag says otherwise (`v1.0.0-rc.1`).
            prerelease=false
            case "$version" in *-*) prerelease=true ;; esac
          else
            version="$(node scripts/version.mjs next)"
            prerelease=true
            [ -n "$version" ] || echo "Nothing to release since the last tag."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version:-nothing} (pre-release: $prerelease)"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            label: macos-arm64
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev protobuf-compiler patchelf file

      - uses: arduino/setup-protoc@v3
        if: runner.os == 'macOS'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.label }}

      # The pinned release core, verified against core.lock. A core built from source has its parent
      # check off and is refused for bundling; this one is the published release build.
      - name: Fetch the pinned core
        run: ./scripts/fetch-core.sh

      # Into this checkout only; the commit back to main comes after the release is out.
      - name: Stamp the version
        # The base number: bundle versions are X.Y.Z, and a suffix (`-rc.1`) lives in the tag.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/version.mjs set "${VERSION%%-*}"

      - name: Build
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        env:
          # linuxdeploy is itself an AppImage, and the runners have no FUSE to mount it with.
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Collect the bundles
        run: |
          mkdir -p out
          bundle=src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp "$bundle"/dmg/*.dmg out/
            # The app itself too, for anyone who would rather not mount a disk image.
            ditto -c -k --keepParent "$bundle/macos/Nunya.app" "out/Nunya_${{ needs.version.outputs.version }}_aarch64.app.zip"
          else
            cp "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage out/
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: out
          merge-multiple: true

      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cat > notes.md <<NOTES
          ## Installing

          **macOS (Apple Silicon)**: open \`Nunya_${VERSION}_aarch64.dmg\` and drag Nunya into Applications.
          This build is not yet signed by an Apple Developer account, so the first time you open it macOS will
          refuse. Open **System Settings → Privacy & Security** and choose **Open Anyway**. (Or, in Terminal:
          \`xattr -dr com.apple.quarantine /Applications/Nunya.app\`.)

          **Linux and Windows**: not in this build yet. Linux comes next, then Windows.

          Check any download against \`SHA256SUMS\`: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`.

          ## In this build

          **Proxy mode**: a local SOCKS/HTTP listener, which can also be set as the system proxy while connected.
          **VPN mode** asks for your administrator password the first time you connect in it (and again after an
          update).
          NOTES
          flags=(--title "Nunya $VERSION" --notes-file notes.md --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            flags+=(--verify-tag)
          else
            # A merge: the tag is made here, on the commit that was built.
            flags+=(--target "$GITHUB_SHA")
          fi
          gh release create "v$VERSION" out/* "${flags[@]}"

      # So main's files say the version it has reached. Onto main as it is now, not the commit that
      # was built: a merge that landed during the build must not be undone. A stable tag lower than
      # main's version (a hotfix line) leaves the files alone.
      - name: Commit the version to main
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base="${VERSION%%-*}"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git checkout --quiet -B main origin/main
            current="$(node -p "require('./package.json').version")"
            if [ "$(printf '%s\n%s\n' "$current" "$base" | sort -V | tail -1)" != "$base" ]; then
              echo "main is at $current, ahead of $base; leaving it"
              exit 0
            fi
            node scripts/version.mjs set "$base"
            if git diff --quiet; then
              echo "main already says $base"
              exit 0
            fi
            git commit --quiet -am "chore(release): v$base"
            # Rejected only when someone merged in between; fetch and try again on top of them.
            git push --quiet origin main && exit 0
            sleep 5
          done
          echo "::error::could not push the version bump to main"
          exit 1
