name: release

# Every merge to main is a release, and a tag a person pushes is a stable one.
#
# - **A merge to main** publishes a beta (a GitHub pre-release). The version is worked out, not
#   typed: from the newest `vX.Y.Z` tag, a `feat:` merge bumps the middle number and anything else
#   the last (`scripts/version.mjs`). The first number never moves on its own.
# - **A tag you push** (`git tag v1.0.0 && git push origin v1.0.0`) publishes that version as a
#   stable release, marked Latest. "This is stable" is a decision, so it is the one number a person
#   picks; merges after it keep counting from it.
#
# Either way the version is stamped into the build, so the installers say it, and then committed
# back to main so the files do too. That commit is pushed with the workflow's own token, which by
# GitHub's rule starts no workflow run: no loop, and no second release for it.
#
# The macOS build is ad-hoc signed and carries no NetworkExtension entitlements: those need an Apple
# Developer team, and macOS kills an app that claims them without one. VPN mode on macOS runs its
# core as root instead, after the administrator prompt (`core_proc::grant_root`).
# scripts/build-app.sh is the signed build, with the packet tunnel extension, for when there is one.
#
# Releases are macOS and Windows for now. Linux comes back next (the arm64 AppImage fails in
# linuxdeploy). The Linux dependency step and bundle collection are kept, so a Linux row in the
# matrix is all it takes to bring it back once its build passes.
#
# The Windows build is an NSIS installer, unsigned: SmartScreen warns before the first run. It puts
# the core beside Nunya.exe, which is where the release core's parent check requires it.
#
# Every release is also an update. The packages the app installs (the macOS .app.tar.gz, the
# Windows installer) are signed with the updater key in TAURI_SIGNING_PRIVATE_KEY, whose public
# half is compiled into the app, and `latest.json` names them with their signatures. The app
# reads it from the newest release it may take (src-tauri/src/update.rs).
# Without the key (the beta, for now) the release is published with no update packages.

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

# One release at a time, and never cancelled: two merges close together are two releases, the
# second computed from the first's tag, not one release that silently swallows the other.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Which version this is
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            # A tag on a branch nobody merged is not a release.
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
              exit 1
            fi
            # Stable, unless the tag says otherwise (`v1.0.0-rc.1`).
            prerelease=false
            case "$version" in *-*) prerelease=true ;; esac
          else
            version="$(node scripts/version.mjs next)"
            prerelease=true
            [ -n "$version" ] || echo "Nothing to release since the last tag."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version:-nothing} (pre-release: $prerelease)"

  build:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            label: macos-arm64
            bundles: app,dmg
          - runner: windows-latest
            label: windows-x86_64
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    # Git Bash on Windows, so the scripts run the same everywhere.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev protobuf-compiler patchelf file

      - uses: arduino/setup-protoc@v3
        if: runner.os != 'Linux'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.label }}

      # The pinned release core, verified against core.lock. A core built from source has its parent
      # check off and is refused for bundling; this one is the published release build.
      - name: Fetch the pinned core
        run: ./scripts/fetch-core.sh

      # Into this checkout only; the commit back to main comes after the release is out.
      - name: Stamp the version
        # The base number: bundle versions are X.Y.Z, and a suffix (`-rc.1`) lives in the tag.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/version.mjs set "${VERSION%%-*}"

      # Update packages only here, not in tauri.conf.json: a local build has no key to sign with.
      # Nor, during the beta, does this one. Without TAURI_SIGNING_PRIVATE_KEY the release goes out
      # with no update packages and no latest.json, which update.rs skips; installed copies hear of
      # releases again once the secret is set, with no change here.
      - name: Build
        run: |
          updater=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            updater=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: releasing without update packages"
          fi
          npm run tauri build -- --bundles ${{ matrix.bundles }} "${updater[@]}"
        env:
          # linuxdeploy is itself an AppImage, and the runners have no FUSE to mount it with.
          APPIMAGE_EXTRACT_AND_RUN: 1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect the bundles
        run: |
          mkdir -p out
          bundle=src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp "$bundle"/dmg/*.dmg out/
            # The app itself too, for anyone who would rather not mount a disk image.
            ditto -c -k --keepParent "$bundle/macos/Nunya.app" "out/Nunya_${{ needs.version.outputs.version }}_aarch64.app.zip"
            # The update package, named for its version and architecture like everything else.
            if [ -f "$bundle/macos/Nunya.app.tar.gz.sig" ]; then
              update="out/Nunya_${{ needs.version.outputs.version }}_aarch64.app.tar.gz"
              cp "$bundle/macos/Nunya.app.tar.gz" "$update"
              cp "$bundle/macos/Nunya.app.tar.gz.sig" "$update.sig"
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            # The installer is the update package too; its signature, when signed, is beside it.
            cp "$bundle"/nsis/*-setup.exe out/
            if ls "$bundle"/nsis/*-setup.exe.sig >/dev/null 2>&1; then
              cp "$bundle"/nsis/*-setup.exe.sig out/
            fi
          else
            cp "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage out/
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: out
          merge-multiple: true

      # The signatures go into the manifest and are not published on their own. None, no manifest.
      - name: Updater manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if ! ls out/*.sig >/dev/null 2>&1; then
            echo "No update packages: publishing without latest.json"
            exit 0
          fi
          node scripts/updater-manifest.mjs out "$VERSION" "$GITHUB_REPOSITORY" > latest.json
          rm out/*.sig
          mv latest.json out/
          cat out/latest.json

      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          # Only a release carrying update packages can say it updates itself.
          UPDATING=""
          if [ -f out/latest.json ]; then
            UPDATING="**Updating**: from this version on, Nunya checks for new releases every hour and downloads them
          itself; **Restart to update** installs one. Betas are offered unless **Beta versions** is turned
          off in Advanced. \`Nunya_${VERSION}_aarch64.app.tar.gz\` and \`latest.json\` are what it downloads.
          "
          fi
          cat > notes.md <<NOTES
          ## Installing

          **macOS (Apple Silicon)**: open \`Nunya_${VERSION}_aarch64.dmg\` and drag Nunya into Applications.
          This build is not yet signed by an Apple Developer account, so the first time you open it macOS will
          refuse. Open **System Settings → Privacy & Security** and choose **Open Anyway**. (Or, in Terminal:
          \`xattr -dr com.apple.quarantine /Applications/Nunya.app\`.)

          **Windows (x86-64)**: run \`Nunya_${VERSION}_x64-setup.exe\`. This build is not yet code-signed, so
          SmartScreen may warn before it runs: choose **More info → Run anyway**.

          **Linux**: not in this build yet. It comes next.

          ${UPDATING}
          Check any download against \`SHA256SUMS\`: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`.

          ## In this build

          **Proxy mode**: a local SOCKS/HTTP listener, which can also be set as the system proxy while connected.
          **VPN mode** on macOS asks for your administrator password the first time you connect in it (and again
          after an update). On Windows it restarts Nunya as administrator, through Windows' own prompt.
          NOTES
          flags=(--title "Nunya $VERSION" --notes-file notes.md --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease --latest=false)
          else
            flags+=(--latest)
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            flags+=(--verify-tag)
          else
            # A merge: the tag is made here, on the commit that was built.
            flags+=(--target "$GITHUB_SHA")
          fi
          gh release create "v$VERSION" out/* "${flags[@]}"

      # So main's files say the version it has reached. Onto main as it is now, not the commit that
      # was built: a merge that landed during the build must not be undone. A stable tag lower than
      # main's version (a hotfix line) leaves the files alone.
      - name: Commit the version to main
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base="${VERSION%%-*}"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git checkout --quiet -B main origin/main
            current="$(node -p "require('./package.json').version")"
            if [ "$(printf '%s\n%s\n' "$current" "$base" | sort -V | tail -1)" != "$base" ]; then
              echo "main is at $current, ahead of $base; leaving it"
              exit 0
            fi
            node scripts/version.mjs set "$base"
            if git diff --quiet; then
              echo "main already says $base"
              exit 0
            fi
            git commit --quiet -am "chore(release): v$base"
            # Rejected only when someone merged in between; fetch and try again on top of them.
            git push --quiet origin main && exit 0
            sleep 5
          done
          echo "::error::could not push the version bump to main"
          exit 1
