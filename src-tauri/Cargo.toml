[package]
name = "nunya"
version = "0.8.1"
edition = "2021"
rust-version = "1.77"
description = "A TUN-only client for the Nunya core"
default-run = "nunya"

[lib]
name = "nunya_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.13"

# Compiles macos/tunnel_manager.m into the binary, so the NETunnelProviderManager control plane
# needs no separate Xcode project on the app side.
[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

# The tray on Linux is our own StatusNotifierItem rather than tray-icon's libayatana one; `sni.rs`
# says why. `dbus` is already linked into the binary by tao, so this adds a method-dispatch layer
# over a library the build was paying for anyway rather than a second D-Bus stack (zbus would be
# that, and pure-Rust async buys nothing here: the item lives on one thread of its own).
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
dbus-crossroads = "0.5"

[dependencies]
# `macos-private-api`: the menu-bar popover is a transparent window, which on macOS Tauri can
# only make through a private AppKit call (see `popover.rs`). This app is not sold through the
# App Store, which is what that API would rule out.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "process",
    "sync",
    "time",
] }
prost = "0.13"
async-trait = "0.1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# The TLS stack ureq already carries, named because `cloudflare.rs` speaks TLS itself: the edge
# probe times a handshake and sends its one request over that connection. Same features as ureq's,
# so this adds no code to the build.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# ureq's default trust roots, named so the edge probe trusts the same ones.
webpki-roots = "0.26"
# Release tags compared as versions, not strings: v0.10.0 is newer than v0.9.0. Already in the
# build through the updater.
semver = "1"
# Pinned: 2.13 needs Tauri 2.12, which moves tray-icon to 0.25 and changes the macOS tray (see
# CLAUDE.md, *The menu-bar popover*). Move it with Tauri, not before.
tauri-plugin-updater = "=2.12.0"

# The core link on Windows is a named pipe, and our half of the peer check asks the pipe for its
# client's pid. 0.61 is the version tokio already brings, so this adds nothing to the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# A VPN client is a trust artifact: smaller and stripped means less to audit and a smaller
# attack surface, and panic=abort removes unwinding paths entirely.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
