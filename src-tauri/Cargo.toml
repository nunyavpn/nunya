[package]
name = "nunya"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "A TUN-only client for the Nunya core"
default-run = "nunya"

[lib]
name = "nunya_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.13"

# Compiles macos/tunnel_manager.m into the binary, so the NETunnelProviderManager control plane
# needs no separate Xcode project on the app side.
[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"

[dependencies]
# `macos-private-api`: the menu-bar popover is a transparent window, which on macOS Tauri can
# only make through a private AppKit call (see `popover.rs`). This app is not sold through the
# App Store, which is what that API would rule out.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "process",
    "sync",
    "time",
] }
prost = "0.13"
async-trait = "0.1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
# The TLS stack ureq already carries, named so `cloudflare.rs` can tell a failed handshake from a
# timeout by its cause, and so its tests can run a TLS server. Same features as ureq's, so this
# adds no code to the build.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# ureq's default trust roots, named so the edge probe's timed handshake trusts the same ones.
webpki-roots = "0.26"

[profile.release]
# A VPN client is a trust artifact: smaller and stripped means less to audit and a smaller
# attack surface, and panic=abort removes unwinding paths entirely.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
