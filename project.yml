# XcodeGen spec for the packet tunnel extension.
#
# The Tauri app is built by cargo and needs no Xcode project. This one exists solely to compile and
# sign NunyaTunnel.appex, which the app bundle then embeds — Tauri has no concept of an app
# extension, and a hand-written .pbxproj is not something anyone should have to maintain.
#
#   brew install xcodegen
#   xcodegen generate
#   ./scripts/build-extension.sh
#
# Generated by: xcodegen. Do not edit NunyaTunnel.xcodeproj by hand; edit this file instead.

name: NunyaTunnel
options:
  bundleIdPrefix: com.nunyavpn.app
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

settings:
  base:
    # A Personal Team cannot sign the NetworkExtension entitlement, so leave signing to the
    # developer's own settings rather than hard-coding a team that will not exist on other machines.
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  NunyaTunnel:
    type: app-extension
    platform: macOS
    sources:
      - path: NunyaTunnel
    dependencies:
      # Installed by scripts/fetch-core.sh from the pinned nunya-core release. Embedded rather than
      # merely linked: the extension is its own process and cannot borrow the app's copy.
      - framework: vendor/core/apple/NunyaCore.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nunyavpn.app.NunyaTunnel
        PRODUCT_NAME: NunyaTunnel
        INFOPLIST_FILE: NunyaTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: NunyaTunnel/NunyaTunnel.entitlements
        # gomobile frameworks ship a module map, so Swift can `import NunyaCore` directly.
        CLANG_ENABLE_MODULES: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        # The framework is copied into the .appex, so it resolves relative to the bundle itself
        # rather than the host app.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        # Go's net package resolves through cgo on Darwin, which pulls res_9_ninit/nsearch/nclose
        # out of libresolv. Nothing in the Swift references them, so only the Go archive needs it.
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lresolv"
